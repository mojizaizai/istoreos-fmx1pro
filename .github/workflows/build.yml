name: Build iStoreOS for FMX1 Pro

# Native-style port: official istoreos/istoreos source (branch istoreos-24.10)
# + official rockchip armv8 build config from the koolcenter CDN, with a single
# device added (FMX1 Pro, RK3399) whose DTS comes from the board's Armbian DTB.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libperl-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone official iStoreOS source
        run: |
          git clone --depth 1 -b istoreos-24.10 https://github.com/istoreos/istoreos.git openwrt

      - name: Apply FMX1 Pro device
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/device/apply-device.sh"

      - name: Stamp build version
        id: stamp
        run: |
          STAMP="$(date +%Y%m%d)-${{ github.run_number }}"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          mkdir -p openwrt/files/etc
          echo "$STAMP" > openwrt/files/etc/fmx1-version
          echo "build stamp: $STAMP"

      - name: Use official build config (easepi-r1 baseline), FMX1 Pro only
        run: |
          cd openwrt
          wget --no-check-certificate -O feeds.conf \
            "https://fw0.koolcenter.com/iStoreOS/easepi-r1/feeds.conf"
          wget --no-check-certificate -O .config \
            "https://fw0.koolcenter.com/iStoreOS/easepi-r1/config.buildinfo"
          # Turn off every pre-enabled rockchip device, enable only FMX1 Pro.
          sed -i -E 's/^(CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_[A-Za-z0-9_.-]+)=y$/# \1 is not set/' .config
          grep -q "CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_rockchip_fmx1-pro" .config || \
            echo "CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_rockchip_fmx1-pro=y" >> .config
          # USB 2.5G NIC support (Realtek RTL8156B/BG dongles, r8152 driver)
          echo "CONFIG_PACKAGE_kmod-usb-net-rtl8152=y" >> .config
          grep "fmx1-pro" .config

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Defconfig and download sources
        run: |
          cd openwrt
          make defconfig
          grep "DEVICE_rockchip_fmx1-pro" .config || (echo "::error::fmx1-pro not in final .config" && exit 1)
          make download -j8
          find dl -size -1024c -exec ls -l {} \; -exec rm -f {} \; || true

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Collect firmware
        run: |
          mkdir -p firmware
          find openwrt/bin/targets/rockchip/armv8 -name "*fmx1-pro*" -exec cp -v {} firmware/ \;
          ls -la firmware/
          ls firmware/ | grep -q "sysupgrade" || (echo "::error::no fmx1-pro sysupgrade image produced" && exit 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-fmx1-pro
          path: firmware/
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.stamp.outputs.stamp }}
          name: iStoreOS 24.10 for FMX1 Pro (${{ steps.stamp.outputs.stamp }})
          body: |
            iStoreOS (istoreos-24.10, official source + official easepi-r1 config baseline)
            with the FMX1 Pro (RK3399) device added. Board DTS derived from the
            board's Armbian DTB (rk3399-fmx1-pro.dtb, kernel 6.18.63).

            Default: root / password. Single NIC = LAN (bypass-router mode).
            Flash the squashfs sysupgrade image to a TF card first and test-boot
            before installing to eMMC.
          files: firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update update manifest (device update address)
        run: |
          IMG="istoreos-rockchip-armv8-rockchip_fmx1-pro-squashfs-sysupgrade.img.gz"
          SHA="$(sha256sum "firmware/$IMG" | cut -d' ' -f1)"
          TAG="v${{ steps.stamp.outputs.stamp }}"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$IMG"
          mkdir -p update
          printf '{\n  "version": "%s",\n  "url": "%s",\n  "sha256": "%s"\n}\n' \
            "${{ steps.stamp.outputs.stamp }}" "$URL" "$SHA" > update/update.json
          cat update/update.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update/update.json
          git commit -m "Point device update address at $TAG"
          git push
